<section class="add-wrapper">
  <h2>Dodaj osobę</h2>

  <form (ngSubmit)="save()" #f="ngForm" class="add-form">
    <div class="form-row">
      <label for="firstName">Imię</label>
      <input
        id="firstName"
        type="text"
        name="firstName"
        [(ngModel)]="person.firstName"
        required
      />
    </div>
    <div class="form-row">
      <label for="lastName">Nazwisko</label>
      <input
        id="lastName"
        type="text"
        name="lastName"
        [(ngModel)]="person.lastName"
        required
      />
    </div>
    <div class="form-row">
      <label for="age">Wiek</label>
      <input
        id="age"
        type="number"
        name="age"
        [(ngModel)]="person.age"
        min="0"
      />
    </div>
    <h3>Adres</h3>
    <div class="form-row">
      <label for="city">Miasto</label>
      <input
        id="city"
        type="text"
        name="city"
        [(ngModel)]="person.address!.city"
      />
    </div>
    <div class="form-row">
      <label for="street">Ulica</label>
      <input
        id="street"
        type="text"
        name="street"
        [(ngModel)]="person.address!.street"
      />
    </div>
    <div class="form-row">
      <label for="postCode">Kod pocztowy</label>
      <input
        id="postCode"
        type="text"
        name="postCode"
        [(ngModel)]="person.address!.postCode"
      />
    </div>
    <button type="submit" class="btn-save">
      Zapisz
    </button>
  </form>
</section>
